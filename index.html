<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#245edb" />
    <meta name="description" content="Trent's personal website, styled as a Windows XP desktop." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>tgOS</title>
    <!--
      Applied before any stylesheet loads, so there is never a flash of white: the page starts on the log-on
      blue, and navigating between the log-on screen and the desktop crossfades instead of cutting.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #5a7edc;
      }
      @view-transition {
        navigation: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
