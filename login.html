<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00309c" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The Worker fills this in from its TURNSTILE_SITE_KEY var. A sitekey is public by design. -->
    <meta name="turnstile-sitekey" content="" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Log On - tgOS</title>
    <!--
      Applied before any stylesheet loads, so there is never a flash of white: the page starts on the log-on
      blue, and navigating between the log-on screen and the desktop crossfades instead of cutting.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #5a7edc;
      }
      @view-transition {
        navigation: auto;
      }
      /* Hide the screen until its stylesheet has arrived (login.css reveals it); show it after 2s regardless. */
      body {
        opacity: 0;
        animation: logon-reveal 0s 2s forwards;
      }
      @keyframes logon-reveal {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="av-bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fc2fa" />
          <stop offset="1" stop-color="#2a6bd6" />
        </linearGradient>
        <linearGradient id="av-skin" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fbe3c4" />
          <stop offset="1" stop-color="#e9b985" />
        </linearGradient>
        <symbol id="avatar-trent" viewBox="0 0 48 48">
          <rect x="3" y="3" width="42" height="42" rx="5" fill="#fff" stroke="#9fb0cf" />
          <rect x="6" y="6" width="36" height="36" rx="3" fill="url(#av-bg)" />
          <path d="M9 42c0-11 7-14 15-14s15 3 15 14z" fill="#f4f7fc" />
          <path d="M20 28.5c1 2 7 2 8 0l1.5 3.5c-3 2-8 2-11 0z" fill="#d8e3f5" />
          <circle cx="24" cy="19" r="7.5" fill="url(#av-skin)" stroke="#b98a56" stroke-width=".8" />
          <path d="M16.5 18c0-6 4-8 8-8s7.5 2 7.5 7.5c-2-3-5-4-8-4s-5 1-7.5 4.5z" fill="#6b4423" />
        </symbol>
        <linearGradient id="av-warm" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd58a" />
          <stop offset="1" stop-color="#f08a3c" />
        </linearGradient>
        <linearGradient id="av-grey" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c9d3e2" />
          <stop offset="1" stop-color="#7f8ea8" />
        </linearGradient>
        <symbol id="avatar-family" viewBox="0 0 48 48">
          <rect x="3" y="3" width="42" height="42" rx="5" fill="#fff" stroke="#9fb0cf" />
          <clipPath id="av-family-inner"><rect x="6" y="6" width="36" height="36" rx="3" /></clipPath>
          <rect x="6" y="6" width="36" height="36" rx="3" fill="url(#av-warm)" />
          <g clip-path="url(#av-family-inner)">
          <path d="M6 42c0-9 4-12 10-12s10 3 10 12z" fill="#6bb8ff" />
          <circle cx="16" cy="22" r="6" fill="url(#av-skin)" stroke="#b98a56" stroke-width=".8" />
          <path d="M10 21c0-5 3-7 6-7s6 2 6 6c-2-2-4-3-6-3s-4 1-6 4z" fill="#3a2414" />
          <path d="M22 42c0-10 4-14 11-14s11 4 11 14z" fill="#4ac85a" />
          <circle cx="33" cy="20" r="6.5" fill="url(#av-skin)" stroke="#b98a56" stroke-width=".8" />
          <path d="M26.5 20c0-6 3.5-8 6.5-8s6.5 2 6.5 7c-1-3-4-4-6.5-4s-5 1-6.5 5z" fill="#c8782a" />
          </g>
        </symbol>
        <symbol id="avatar-guests" viewBox="0 0 48 48">
          <rect x="3" y="3" width="42" height="42" rx="5" fill="#fff" stroke="#9fb0cf" />
          <rect x="6" y="6" width="36" height="36" rx="3" fill="url(#av-grey)" />
          <path d="M10 42c0-10 6-14 14-14s14 4 14 14z" fill="#eef2f8" />
          <circle cx="24" cy="19" r="7.5" fill="#eef2f8" />
        </symbol>
      </defs>
    </svg>

    <!--
      The XP "Welcome" screen. data-state drives everything: idle -> challenge -> verifying -> welcome.
      This page is the only HTML an unauthenticated visitor ever receives. Keep it free of real content.
    -->
    <div class="logon" id="logon" data-state="idle">
      <div class="logon-top"></div>

      <main class="logon-stage">
        <section class="logon-brand">
          <!-- logo:start (generated by design/logo-build/build.mjs; edit that, not this) -->

.64L22.32 -23.03Q24.7 -22.35 26.84 -20.89Q28.97 -19.42 30.03 -17.23Q31.08 -15.03 31.08 -12.6Q31.08 -7.15 27.03 -3.15Q22.97 0.85 15.18 0.85Q3.11 0.85 -0.47 -9.11L6.06 -11.43Q8.44 -5.16 15.62 -5.16Q19.72 -5.16 21.71 -7.05Q23.7 -8.94 23.7 -11.34Q23.7 -12.71 22.95 -13.73Q22.21 -14.74 21.06 -15.26Q19.92 -15.79 16.49 -16.76Q11.72 -18.13 9.36 -19.37Q7 -20.6 5.52 -22.94Q4.04 -25.28 4.04 -28.51Q4.04 -33.98 8 -37.47Q11.95 -40.96 18.78 -40.96Q28.86 -40.96 32.67 -32.4Z"/></g></g></svg></h1>
          <!-- logo:end -->
          <p class="brand-hint">To begin, click your user name</p>
        </section>

        <section class="logon-users">
          <button class="user-tile" type="button" data-id="trent" data-user="Trent" data-avatar="avatar-trent" id="tile-trent">
            <svg class="avatar" aria-hidden="true"><use href="#avatar-trent" /></svg>
            <span class="user-name">Trent</span>
          </button>
          <button class="user-tile" type="button" data-id="family" data-user="Family &amp; Friends" data-avatar="avatar-family" id="tile-family">
            <svg class="avatar" aria-hidden="true"><use href="#avatar-family" /></svg>
            <span class="user-name">Family &amp; Friends</span>
          </button>
          <button class="user-tile" type="button" data-id="guests" data-user="Guests" data-avatar="avatar-guests" id="tile-guests">
            <svg class="avatar" aria-hidden="true"><use href="#avatar-guests" /></svg>
            <span class="user-name">Guests</span>
          </button>

          <div class="user-card" id="challenge" aria-live="polite">
            <div class="card-head">
              <svg class="avatar" aria-hidden="true"><use id="card-avatar" href="#avatar-guests" /></svg>
              <div>
                <div class="user-name" id="card-name">Guests</div>
                <p class="card-prompt" id="card-prompt">Prove you're human to log on</p>
              </div>
            </div>
            <div class="widget" id="turnstile"></div>
            <form class="password-form" id="password-form" autocomplete="on">
              <!-- A hidden username lets password managers tell the two passwords apart. -->
              <input type="text" id="password-user" name="username" autocomplete="username" hidden />
              <input
                class="password-input"
                id="password-input"
                type="password"
                name="password"
                autocomplete="current-password"
                aria-label="Password"
                maxlength="256"
                required
              />
              <button class="password-go" type="submit" aria-label="Log on">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 10h11M11 5.5l4.5 4.5-4.5 4.5" />
                </svg>
              </button>
            </form>
            <p class="card-status" id="status" role="status"></p>
            <button class="card-back" id="card-back" type="button">&larr; Pick a different user</button>
            <div class="balloon" id="balloon" role="alert">
              <strong>Logon unsuccessful</strong>
              <p id="balloon-text"></p>
            </div>
          </div>
        </section>
      </main>

      <div class="logon-welcome" aria-live="polite"><span>welcome</span></div>

      <footer class="logon-bottom">
        <button class="turn-off" id="turn-off" type="button">
          <span class="power" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
              <path d="M10 4v6M6.2 6.5a5.5 5.5 0 1 0 7.6 0" />
            </svg>
          </span>
          <span>Turn off computer</span>
        </button>
        <p class="bottom-note">
          To keep bots and AI crawlers out, a quick security check runs before you log on.
        </p>
      </footer>
    </div>

    <div class="power-off" id="power-off" hidden>
      <!-- Only this button turns the computer back on: clicking the black screen does nothing. -->
      <button class="power-button" id="power-on" type="button" aria-label="Turn the computer on" title="Power">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true">
          <path d="M17 5v11" />
          <path d="M10.2 9.6a11 11 0 1 0 13.6 0" />
        </svg>
      </button>
    </div>

    <script type="module" src="/src/login/main.ts"></script>
  </body>
</html>
